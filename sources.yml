# Every work the server knows about.
#
# To add a book: add an entry here, then run `npm run build:index`.
# Paths in `repo` are relative to SOURCES_ROOT (default: the folder that
# contains this repo, i.e. the sibling checkouts in ~/github).
#
# text_access
#   full    section text, code, and links are served
#   teaser  only titles, a short opening excerpt, code, and links are served
#           (use for books whose prose is all rights reserved)
#
# Each source has one default `citation`. `volume_citations` maps chapter files
# to a different work (e.g. the Springer print volume that contains them); a
# section in one of those files is cited as that volume first and the online
# edition second.

authors: &mike
  - family: Nguyen
    given: Mike
    orcid: 0000-0002-3432-8595

sources:
  - id: data_analysis
    title: A Guide on Data Analysis
    summary: >-
      Data analysis, econometrics, and causal inference in R: regression, GLMs,
      mixed models, experiments, difference-in-differences, synthetic control,
      regression discontinuity, instrumental variables, matching, double machine
      learning, mediation, sensitivity analysis, and structural IO.
    repo: data_analysis
    format: bookdown
    # Moved from bookdown.org/mike/data_analysis (now a redirect) to Posit Connect Cloud.
    site: https://mike-data-analysis.share.connect.posit.cloud/
    github: https://github.com/mikenguyen13/data_analysis
    text_access: full
    license: { text: CC-BY-NC-SA-4.0, code: CC-BY-NC-SA-4.0 }
    exclude:
      - 50.2-bookdown_cheat_sheet.Rmd
    citation:
      key: Nguyen2020Guide
      type: book
      title: A Guide on Data Analysis
      authors: *mike
      year: 2020
      url: https://mike-data-analysis.share.connect.posit.cloud/
    # Print volumes (Springer, cited by DOI) and their chapter DOIs, from the ORCID record
    # (data/publications.json). A section is cited as its chapter, then its volume.
    volume_citations:
      - files: [02.1-prerequisites.Rmd, 03-descriptive-stat.Rmd, 04-basic-inference.Rmd]
        chapters:
          02.1-prerequisites.Rmd: 10.1007/978-3-032-01858-8_2
          03-descriptive-stat.Rmd: 10.1007/978-3-032-01858-8_3
          04-basic-inference.Rmd: 10.1007/978-3-032-01858-8_4
        citation:
          key: Nguyen2025Vol1
          type: book
          title: Foundations of Data Analysis
          volume: 1
          authors: *mike
          year: 2025
          publisher: Springer
          place: Cham
          doi: 10.1007/978-3-032-01858-8
          url: https://doi.org/10.1007/978-3-032-01858-8
      - files: [05-linear-regression.Rmd, 06-nonlinear-regession.Rmd, 07-generalized-linear-models.Rmd, 08-linear-mixed-models.Rmd, 09-nonlinear_generalized_linear_mixed.Rmd, 10-nonparam-regression.Rmd]
        citation:
          key: Nguyen2026Vol2
