  - id: causalverse
    title: "causalverse: The All-in-One Causal Inference Toolkit"
    summary: >-
      R package for the full causal inference pipeline: RCTs and power, DiD and
      staggered adoption, synthetic DiD, synthetic control, RD, IV, event
      studies, matching, heterogeneous effects, mediation, sensitivity, and
      publication-ready output. Vignettes plus a function reference.
    repo: causalverse
    format: r-package
    site: https://mikenguyen13.github.io/causalverse/
    github: https://github.com/mikenguyen13/causalverse
    text_access: full
    license: { text: GPL-3.0, code: GPL-3.0 }
    citation:
      key: Nguyen2026causalverse
