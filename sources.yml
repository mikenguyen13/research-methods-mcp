  - id: data_analysis
    title: A Guide on Data Analysis
    summary: >-
      Data analysis, econometrics, and causal inference in R: regression, GLMs,
      mixed models, experiments, difference-in-differences, synthetic control,
      regression discontinuity, instrumental variables, matching, double machine
      learning, mediation, sensitivity analysis, and structural IO.
    repo: data_analysis
    format: bookdown
    # Moved from bookdown.org/mike/data_analysis (now a redirect). GitHub Pages is the
    # canonical host since data_analysis b0ec9a9; the Posit Connect copy is a duplicate.
    site: https://mikenguyen13.github.io/data_analysis/
    github: https://github.com/mikenguyen13/data_analysis
    # Published by hand: gh-pages holds a render of lit-review/2026-08-12 at 1b617e6e5
    # (2026-10-24; its timing-IV section is live, c09b96cbc's measurement-error section
    # is not), patched in place by df592f0b7 (E3 box) and 61b833757 (the regsensitivity
    # sections of #9). Branch published/2026-11-24 at b356a11c5 is 1b617e6e5 plus that
    # text, i.e. the source of what is live. Its commits do not name the source, so
    # the source is pinned.
    deploy:
      branch: gh-pages
      source: "b356a11c5bcb52089e32d5e8c1f1df3dff8538a8"
      tip: "61b83375782a1e60b00a921079038b142db91f96"
