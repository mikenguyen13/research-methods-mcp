# Every work the server knows about.
#
# To add a book: add an entry here, then run `npm run build:index`.
# Paths in `repo` are relative to SOURCES_ROOT (default: the folder that
# contains this repo's main checkout, i.e. the sibling checkouts in ~/github).
#
# deploy: which commit of the book the live site was built from. The index is
# built from that commit, never from what the local checkout has checked out
# (checkouts usually sit on unpublished work branches). The build reads the
# commit straight from the repository's objects after fetching it from `github`
# (a fetch that writes no refs), so the checkout, its branches, and its working
# tree are left untouched.
#   branch  the branch the site is published from
#   source  how to get from that branch's tip to the commit the site was built from:
#             (omitted)  the tip itself: CI or GitHub Pages builds every push, or the
#                        rendered site is committed alongside its source
#             message    the commit named in the tip's message (a rendered-output branch
#                        written by a deploy action, e.g. "Deploying to gh-pages from
#                        @ owner/repo@<sha>")
#             <branch>   that branch as it stood when the tip was committed (a
#                        rendered-output branch published by hand from that branch)
#             <sha>      that commit, pinned by hand; also give `tip`, the branch tip
#                        the pin was checked against. When the branch moves past `tip`
#                        the site was redeployed and the build stops until the pin is
#                        updated.
# `npm run build:index -- --working-tree` reads the checkouts as they are on disk
# instead, to preview unpublished work; never commit an index built that way.
#
# text_access
#   full    section text, code, and links are served
#   teaser  only titles, a short opening excerpt, code, and links are served
#           (use for books whose prose is all rights reserved)
#
# Each source has one default `citation`. `volume_citations` maps chapter files
# to a different work (e.g. the Springer print volume that contains them); a
# section in one of those files is cited as that volume first and the online
# edition second.

authors: &mike
  - family: Nguyen
    given: Mike
    orcid: 0000-0002-3432-8595


# Sites that moved. Links in the books' text to an old address are rewritten to
# the new one when the index is built, so the server never hands out a redirect.
moved:
  - from: https://bookdown.org/mike/data_analysis/
    to: https://mikenguyen13.github.io/data_analysis/
  - from: https://bookdown.org/mike/marketing_research/
    to: https://mikenguyen13.github.io/marketing_research/
  # The Posit Connect copies still serve the same build, but GitHub Pages is the
  # canonical host (growth experiment E2), so links send readers there.
  - from: https://mike-data-analysis.share.connect.posit.cloud/
    to: https://mikenguyen13.github.io/data_analysis/
  - from: https://mike-marketing-research.share.connect.posit.cloud/
    to: https://mikenguyen13.github.io/marketing_research/
  # The bookdown.org copy still serves, but GitHub Pages is the canonical host (E2). Listed
  # here so links are rewritten and its Google Search numbers count toward the book.
  - from: https://bookdown.org/mike/social-theory/
    to: https://mikenguyen13.github.io/social-theory/

