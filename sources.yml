          year: 2026
          publisher: Springer
          place: Cham
          doi: 10.1007/978-3-032-01835-9
          url: https://doi.org/10.1007/978-3-032-01835-9
      - files: [11-data.Rmd, 12-variable_transformation.Rmd, 13-imputation.Rmd, 14-model_specification.Rmd, 15-variable-selection.Rmd, 16-hypothesis.Rmd, 17-marginal-effect.Rmd, 18-moderation.Rmd, 19-mediation.Rmd, 20-prediction_estimation.Rmd]
        chapters:
          11-data.Rmd: 10.1007/978-3-032-01719-2_2
