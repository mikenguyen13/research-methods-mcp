# Applies registry-status.json to the official MCP Registry: each entry sets the
# status (active, deprecated, or deleted) and message of one published version,
# for example to deprecate a version whose remote endpoint no longer exists.
# Runs when the file changes on main, or from the Actions tab; authenticates
# with GitHub OIDC, like the Publish workflow. Re-applying a status is harmless.
name: Registry status
on:
  push:
    branches: [main]
    paths: ['registry-status.json']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registry-status.json
        run: |
          name=$(jq -r .name server.json)
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          jq -r 'to_entries[] | [.key, .value.status, (.value.message // "")] | @tsv' registry-status.json |
            while IFS=$'\t' read -r version status message; do
              echo "Setting $name $version to $status"
              ./mcp-publisher status --status "$status" --message "$message" "$name" "$version"
            done
