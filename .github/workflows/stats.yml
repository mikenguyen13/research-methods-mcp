# Hourly copy of usage numbers (MCP endpoint counters, book-site Google Analytics,
# GitHub stars) into the private Google Sheet behind the Looker Studio dashboard.
# Google access is keyless: GitHub's OIDC token is exchanged, through Workload
# Identity Federation in the research-methods-stats Cloud project, for a one-hour
# token of the stats-sync service account. Only this repository may do that.
# MCP counts come from the endpoint's /stats.json, which accepts this workflow's
# GitHub OIDC token (from main) and nothing else. The only stored secret is the
# optional BING_WEBMASTER_API_KEY (Bing Webmaster Tools has no keyless access).
# Skipped until the STATS_SHEET_ID variable is set. The script prints no counts,
# because this repository's Action logs are public. Setup: docs/DASHBOARD.md.
# The one public output is stats/bio.json (round milestones the bio page shows), which is
# committed only when a milestone changes, so commits are rare.
name: Usage dashboard
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  sync:
    if: vars.STATS_SHEET_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/720871649247/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: stats-sync@research-methods-stats.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/analytics.readonly,https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sync usage numbers to the sheet
        run: npx tsx scripts/sync-stats.ts
        env:
          STATS_SHEET_ID: ${{ vars.STATS_SHEET_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: Bing has no keyless access. Unset, the Bing step is skipped.
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      - name: Publish the bio milestones if they changed
        if: ${{ !cancelled() }}
        run: |
          git diff --quiet -- stats/bio.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the bio milestones' -- stats/bio.json
          git pull --rebase --quiet
          git push
