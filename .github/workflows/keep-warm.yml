# Free Hugging Face Spaces sleep after 48 hours without traffic, and a sleeping
# Space answers MCP clients with a loading page. Ping the health route twice a
# day so the endpoint stays awake, and fail loudly if it is down.
name: Keep endpoint warm
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          endpoint=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/package.json | jq -r .config.endpoint)
          health="${endpoint%/mcp}/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$health"; then exit 0; fi
            sleep 30
          done
          echo "::error::$health did not answer"
          exit 1
