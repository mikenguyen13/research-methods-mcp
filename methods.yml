# Curated method catalog behind the `choose_method` tool.
#
# Each entry maps a research situation to the sections that teach the method
# and to the R and Python packages that implement it. Section ids are checked
# when the index is built, so a renamed section fails the build instead of
# producing a dead link.

methods:
  # --- Experiments -----------------------------------------------------------
  - id: rct
    name: Randomized experiment (RCT, A/B test, field experiment)
    family: Experiments
    use_when: Treatment assignment can be randomized, as in an A/B test, a field experiment, or a laboratory study.
    assumptions: [Random assignment, No interference between units (SUTVA), No differential attrition, Compliance or an intention-to-treat estimand]
    keywords: [randomized, randomization, experiment, a/b test, ab test, rct, field experiment, treatment group, control group, conversion, lift]
    sections: [data_analysis:sec-experimental-design, causalverse:articles/d_rct, marketing_research:47-causal-inference]
    packages: { r: [estimatr, DeclareDesign, randomizr], python: [statsmodels, scipy] }

  - id: power
    name: Power analysis and sample size
    family: Experiments
    use_when: A study is being planned and requires the sample size for a target effect, or the minimum effect a given sample can detect.
    assumptions: [A defensible effect size, A variance estimate, The design and test that will actually be used]
    keywords: [power, sample size, minimum detectable effect, mde, how many observations, how many participants, how many subjects, detect an effect, detect a lift, underpowered, stopping rule]
    sections: [data_analysis:sec-experimental-design#turning-the-sample-size-into-a-stopping-rule, data_analysis:sec-analysis-of-variance-anova#procedure-for-sample-size-selection, data_analysis:sec-mediation#power-analysis-for-mediation]
    packages: { r: [pwr, DeclareDesign, simr], python: [statsmodels] }

  - id: interference
    name: Interference and spillover effects
    family: Experiments
    use_when: One unit's treatment can affect another unit's outcome, as with peers, networks, markets, or clustered rollouts.
    assumptions: [A known exposure mapping or partial interference within groups, Randomization at the cluster or saturation level]
    keywords: [interference, spillover, network effects, peer effects, sutva violation, two-stage randomization, saturation design, contagion]
    sections: [data_analysis:sec-interference-spillover, data_analysis:sec-interference-spillover#sec-ipw-two-stage]
    packages: { r: [inferference], python: [] }

  - id: anova
    name: ANOVA and factorial designs
    family: Experiments
    use_when: Means are compared across several groups or factor combinations in a designed experiment.
    assumptions: [Independent observations, Homogeneous variances or a correction, Approximately normal residuals]
    keywords: [anova, analysis of variance, factorial, f test, post hoc, tukey, repeated measures, ancova]
    sections: [data_analysis:sec-analysis-of-variance-anova]
    packages: { r: [car, emmeans], python: [statsmodels, pingouin] }

  # --- Difference-in-differences family --------------------------------------
  - id: did
    name: Difference-in-differences (two groups, two periods)
    family: Quasi-experimental
    use_when: A policy or shock affects some units at a single point in time, and treated and untreated units are observed before and after.
    assumptions: [Parallel trends in the absence of treatment, No anticipation, Stable group composition, No spillovers to the control group]
    avoid_when: Treatment timing varies across units and effects may differ by cohort; staggered-adoption estimators are then preferable to two-way fixed effects.
    keywords: [difference-in-differences, diff-in-diff, did, policy change, natural experiment, before and after, parallel trends, two-way fixed effects, twfe]
    sections: [data_analysis:sec-difference-in-differences, data_analysis:sec-difference-in-differences#sec-two-way-fixed-effects, data_analysis:sec-difference-in-differences#sec-did-debiasing, causalverse:articles/c_did]
    packages: { r: [fixest, did, HonestDiD], python: [pyfixest, linearmodels] }

  - id: did_staggered
    name: Staggered adoption difference-in-differences
    family: Quasi-experimental
    use_when: Units adopt the treatment at different times (rollouts across states, stores, or users) and effects may change with exposure time.
    assumptions: [Parallel trends for each cohort, No anticipation, A never-treated or not-yet-treated comparison group]
    avoid_when: A conventional two-way fixed-effects coefficient is to be interpreted as the average effect; under heterogeneous effects it can take the wrong sign.
    keywords: [staggered, staggered adoption, rollout, varying treatment timing, callaway sant'anna, sun abraham, de chaisemartin, borusyak, imputation estimator, event study, dynamic effects, goodman-bacon]
    sections: [data_analysis:sec-difference-in-differences#sec-modern-estimators-for-staggered-adoption, data_analysis:sec-difference-in-differences#sec-group-time-average-treatment-effects-callaway2021difference, causalverse:articles/c_did]
    packages: { r: [did, fixest, didimputation, did2s, staggered, DIDmultiplegtDYN, HonestDiD], python: [csdid, pyfixest, differences] }

  - id: sdid
    name: Synthetic difference-in-differences
    family: Quasi-experimental
    use_when: A balanced panel contains few treated units, and parallel trends is doubtful without reweighting units and periods.
    assumptions: [Block or staggered treatment, Pre-treatment fit achievable with unit and time weights, Enough pre-periods]
    keywords: [synthetic difference-in-differences, synthdid, sdid, unit weights, time weights, few treated units, panel]
    sections: [data_analysis:sec-synthetic-difference-in-differences, data_analysis:sec-synthetic-difference-in-differences#staggered-adoption, causalverse:articles/b_synthdid]
    packages: { r: [synthdid, causalverse], python: [synthdid] }

  - id: synthetic_control
    name: Synthetic control
    family: Quasi-experimental
    use_when: One or a few aggregate units (a state, country, firm, or market) are treated, with a long pre-treatment period and a pool of untreated donor units.
    assumptions: [Treated unit lies in the convex hull of donors, No spillovers to donors, Good pre-treatment fit, No anticipation]
    keywords: [synthetic control, scm, single treated unit, one treated unit, case study, donor pool, comparative case study, augmented synthetic control, placebo inference, one state, single state, one country, one city, state law, law passed]
    sections: [data_analysis:sec-synthetic-control, data_analysis:sec-synthetic-control#inference-in-scm, data_analysis:sec-synthetic-control#sec-augmented-synthetic-control, causalverse:articles/f_sc]
    packages: { r: [Synth, tidysynth, augsynth, scpi], python: [pysyncon, scpi_pkg] }

  - id: generalized_sc
    name: Generalized synthetic control and interactive fixed effects
    family: Quasi-experimental
    use_when: Many treated units with staggered timing and unobserved factors that trend differently across units.
    assumptions: [A low-rank factor structure in untreated outcomes, Enough pre-periods to estimate the factors]
    keywords: [generalized synthetic control, gsynth, interactive fixed effects, factor model, matrix completion, counterfactual estimator, fect]
    sections: [data_analysis:sec-synthetic-control#sec-generalized-synthetic-control]
    packages: { r: [gsynth, fect], python: [] }

  - id: changes_in_changes
    name: Changes-in-changes
    family: Quasi-experimental
    use_when: The effect on the entire outcome distribution is of interest in a difference-in-differences setting, or parallel trends in levels is implausible.
    assumptions: [Outcome is monotone in a scalar unobservable, The unobservable's distribution is stable over time within groups]
    keywords: [changes-in-changes, quantile treatment effects, distributional effects, athey imbens, nonlinear did]
    sections: [data_analysis:sec-changes-in-changes]
    packages: { r: [qte], python: [] }

  - id: event_study_finance
    name: Event study (abnormal returns)
    family: Quasi-experimental
    use_when: The reaction of stock prices to announcements, such as earnings, mergers, CEO changes, or marketing events, is to be measured.
    assumptions: [Efficient markets, A clean estimation window, No confounding events in the event window]
    keywords: [event study, abnormal returns, cumulative abnormal returns, car, stock price reaction, announcement, market model, finance]
    sections: [data_analysis:sec-event-studies, causalverse:articles/h_event_study]
    packages: { r: [estudy2, causalverse], python: [statsmodels] }

  # --- Discontinuities and time --------------------------------------------
  - id: rd
    name: Regression discontinuity (sharp and fuzzy)
    family: Quasi-experimental
    use_when: Treatment changes at a known cutoff of a running variable, such as a score, age, date, vote share, or distance.
    assumptions: [Continuity of potential outcomes at the cutoff, No precise manipulation of the running variable, Local estimand at the cutoff]
    keywords: [regression discontinuity, rdd, rd, cutoff, threshold, running variable, forcing variable, bandwidth, sharp, fuzzy, manipulation test, mccrary, density test]
    sections: [data_analysis:sec-regression-discontinuity, data_analysis:sec-regression-discontinuity#sec-sharp-regression-discontinuity-design, data_analysis:sec-regression-discontinuity#sec-fuzzy-regression-discontinuity-design, data_analysis:sec-regression-discontinuity#sec-sorting-bunching-and-manipulation, causalverse:articles/e_rd]
    packages: { r: [rdrobust, rddensity, rdlocrand, rdmulti], python: [rdrobust, rddensity] }

  - id: rkd
    name: Regression kink design
    family: Quasi-experimental
    use_when: The slope (not the level) of a policy schedule changes at a threshold, as with benefit formulas or tax brackets.
    assumptions: [Smooth density of the running variable at the kink, No other policy kinks at the same point]
    keywords: [regression kink, rkd, kink, slope change, benefit schedule, tax bracket]
    sections: [data_analysis:sec-regression-discontinuity#sec-regression-kink-design]
    packages: { r: [rdrobust], python: [rdrobust] }

  - id: its
    name: Interrupted time series
    family: Quasi-experimental
    use_when: A single series is interrupted by an intervention at a known date and there is no comparison group.
    assumptions: [The pre-intervention trend would have continued, No co-occurring shocks, Correct handling of autocorrelation and seasonality]
    keywords: [interrupted time series, its, segmented regression, single series, intervention date, causalimpact, bayesian structural time series]
    sections: [data_analysis:sec-temporal-discontinuity-designs#sec-interrupted-time-series, data_analysis:sec-temporal-discontinuity-designs]
    packages: { r: [CausalImpact, sandwich], python: [statsmodels, tfcausalimpact] }

  # --- Instruments and endogeneity ------------------------------------------
  - id: iv
    name: Instrumental variables (2SLS)
    family: Endogeneity
    use_when: The regressor of interest is endogenous, and a variable is available that shifts it but affects the outcome only through it.
    assumptions: [Relevance (a strong first stage), Exclusion restriction, Independence, Monotonicity for a LATE reading]
    avoid_when: The first stage is weak; weak-instrument-robust inference, such as the Anderson-Rubin test, is then required.
    keywords: [instrumental variables, iv, 2sls, two-stage least squares, endogeneity, instrument, exclusion restriction, first stage, weak instruments, late, complier]
    sections: [data_analysis:sec-instrumental-variables, data_analysis:sec-instrumental-variables#sec-weak-instruments-problem, data_analysis:sec-instrumental-variables#sec-anderson-rubin-approach, causalverse:articles/g_iv]
    packages: { r: [fixest, ivreg, ivmodel, ivDiag], python: [linearmodels, pyfixest] }

  - id: shift_share
    name: Shift-share (Bartik) instruments
    family: Endogeneity
    use_when: The instrument combines local exposure shares with aggregate shocks, as with industry composition interacted with national growth.
    assumptions: [Exogenous shares or exogenous shocks (pick one identification argument), Many independent shocks for shock-based identification]
    keywords: [shift-share, bartik, exposure shares, industry shocks, local labor markets, recentered instruments]
    sections: [data_analysis:sec-instrumental-variables#sec-shift-share-iv, data_analysis:sec-instrumental-variables#sec-recentered-iv]
    packages: { r: [ShiftShareSE, fixest], python: [] }

  - id: examiner_iv
    name: Examiner and judge leniency designs
    family: Endogeneity
    use_when: Cases are as-good-as-randomly assigned to decision makers (judges, examiners, caseworkers, loan officers) who differ in leniency.
    assumptions: [Random assignment of cases to decision makers, Exclusion (decision makers affect outcomes only through the decision), Monotonicity across decision makers]
    keywords: [judge, examiner, leniency, decision maker, random assignment of judges, caseworker, loan officer, patent examiner, judge fixed effects]
    sections: [data_analysis:sec-instrumental-variables#sec-examiner-design]
    packages: { r: [fixest], python: [linearmodels, pyfixest] }

  - id: control_function
    name: Control function and copula approaches
    family: Endogeneity
    use_when: Endogeneity in a nonlinear model, or no external instrument but a credible non-normality or copula argument.
    assumptions: [A correctly specified first stage, Non-normal endogenous regressor for copula methods]
    keywords: [control function, gaussian copula, instrument-free, nonlinear endogeneity, residual inclusion, park gupta]
    sections: [data_analysis:sec-instrumental-variables#sec-control-function-approach, data_analysis:sec-endogeneity#the-gaussian-copula-control-function]
    packages: { r: [REndo], python: [] }

  - id: measurement_error_iv
    name: Measurement error and internal instruments
    family: Endogeneity
    use_when: A regressor is mismeasured, or external instruments are unavailable and identification must rely on higher moments or lags.
    assumptions: [Classical measurement error or non-normality (higher-moment IV), Sequential exogeneity (dynamic panel GMM)]
    keywords: [measurement error, attenuation bias, higher moments, lewbel, dynamic panel, arellano bond, gmm, lagged instruments]
    sections: [data_analysis:sec-instrumental-variables#sec-higher-moment-iv, data_analysis:sec-instrumental-variables#sec-dynamic-panel-iv, data_analysis:sec-endogeneity]
    packages: { r: [REndo, plm], python: [linearmodels] }

  - id: selection
    name: Sample selection (Heckman) and reject inference
    family: Endogeneity
    use_when: Outcomes are observed only for a selected sample, such as wages for workers or default for approved loans.
    assumptions: [An exclusion restriction in the selection equation, Joint normality or a semiparametric alternative]
    keywords: [heckman, sample selection, selection bias, tobit-2, inverse mills ratio, reject inference, approved applicants, truncation]
    sections: [data_analysis:sec-structural-selection#sec-heckman-selection, data_analysis:sec-endogeneity#tobit-2-heckmans-sample-selection-model, credit_score:chapters/10-reject-inference]
    packages: { r: [sampleSelection], python: [statsmodels] }

  # --- Selection on observables and causal ML --------------------------------
  - id: matching
    name: Matching and propensity scores
    family: Selection on observables
    use_when: Treatment is not randomized, but the variables that drive both treatment and outcome are believed to be observed.
    assumptions: [Conditional independence (no unobserved confounding), Overlap (common support), Correct balance on covariates]
    keywords: [matching, propensity score, psm, nearest neighbor, coarsened exact matching, cem, entropy balancing, covariate balance, observational study]
    sections: [data_analysis:sec-matching-methods, data_analysis:sec-matching-methods#sec-propensity-scores, data_analysis:sec-matching-methods#sec-cem, data_analysis:sec-matching-methods#entropy-balancing, causalverse:articles/i_matching]
    packages: { r: [MatchIt, cobalt, WeightIt, optmatch], python: [dowhy, scikit-learn] }

  - id: ipw_dr
    name: Inverse probability weighting and doubly robust estimators
    family: Selection on observables
    use_when: Selection is on observables, and robustness is required if either the outcome model or the propensity model is misspecified.
    assumptions: [Conditional independence, Overlap, One of the two nuisance models correctly specified]
    keywords: [inverse probability weighting, ipw, doubly robust, aipw, tmle, targeted learning, augmented ipw]
    sections: [data_analysis:sec-matching-methods#sec-inverse-probability-weighting, data_analysis:sec-ml-causal#doubly-robust-estimation-and-targeted-learning, data_analysis:sec-ml-causal#augmented-inverse-probability-weighting]
    packages: { r: [WeightIt, AIPW, tmle], python: [econml, dowhy, zepid] }

  - id: dml
    name: Double/debiased machine learning
    family: Causal machine learning
    use_when: Confounding involves many controls or nonlinear relationships, and valid inference on a treatment effect is required while machine learning estimates the nuisance functions.
    assumptions: [Conditional independence given the controls, Overlap, Cross-fitting]
    keywords: [double machine learning, dml, debiased machine learning, cross-fitting, high-dimensional controls, partially linear model, chernozhukov]
    sections: [data_analysis:sec-ml-causal#sec-double-ml, data_analysis:sec-mediation#double-machine-learning-for-mediation, credit_score:chapters/28-causal-credit]
    packages: { r: [DoubleML, hdm], python: [doubleml, econml] }

  - id: hte
    name: Heterogeneous treatment effects and causal forests
    family: Causal machine learning
    use_when: The question is which units benefit most from a treatment, or how to target it, rather than only the average effect.
    assumptions: [Unconfoundedness or randomization, Overlap, Honest estimation for valid intervals]
    keywords: [heterogeneous treatment effects, hte, cate, causal forest, generalized random forest, grf, honesty, targeting, personalization, policy learning]
    sections: [data_analysis:sec-ml-causal#causal-forests-and-generalized-random-forests, data_analysis:sec-ml-causal#sec-honesty-tradeoff, data_analysis:sec-ml-causal#causal-trees-honest-recursive-partitioning, causalverse:articles/k_hte]
    packages: { r: [grf, policytree], python: [econml, causalml] }

  - id: uplift
    name: Uplift modeling
    family: Causal machine learning
    use_when: Customers must be selected for treatment (an offer, email, or discount) so as to maximize incremental response.
    assumptions: [Experimental or unconfounded training data, Honest out-of-sample evaluation with Qini or uplift curves]
    keywords: [uplift, uplift modeling, incremental response, qini, persuadables, targeting, marketing campaign, t-learner, x-learner]
    sections: [data_analysis:sec-uplift-modeling, data_analysis:sec-uplift-modeling#honest-cross-fit-evaluation]
    packages: { r: [grf], python: [causalml, scikit-uplift] }

  # --- Mechanisms and moderation -------------------------------------------
  - id: mediation
    name: Mediation analysis
    family: Mechanisms
    use_when: The question is how much of an effect operates through an intermediate variable.
    assumptions: [Sequential ignorability (no unmeasured mediator-outcome confounding), No treatment-induced confounders unless modeled]
    keywords: [mediation, mediator, indirect effect, direct effect, mechanism, causal pathway, baron kenny, acme, natural indirect effect]
    sections: [data_analysis:sec-mediation, data_analysis:sec-mediation#causal-inference-approach-to-mediation, data_analysis:sec-mediation#sec-med-sensitivity-bounds, causalverse:articles/l_mediation]
    packages: { r: [mediation, lavaan], python: [statsmodels] }

  - id: moderation
    name: Moderation, interactions, and conditional process analysis
    family: Mechanisms
    use_when: The question is for whom or under what conditions an effect is stronger, or moderation is combined with mediation.
    assumptions: [Correct functional form for the interaction, Moderator not affected by treatment]
    keywords: [moderation, moderator, interaction, conditional effect, simple slopes, johnson-neyman, moderated mediation, conditional process, marginal effects]
    sections: [data_analysis:sec-moderation, data_analysis:sec-conditional-process, data_analysis:sec-marginal-effects]
    packages: { r: [marginaleffects, interactions, lavaan], python: [marginaleffects, statsmodels] }

  - id: decomposition
    name: Decomposition methods
    family: Mechanisms
    use_when: A gap (between groups or over time) or a variance is to be decomposed into explained and unexplained components.
    assumptions: [The reference coefficients chosen for the counterfactual, Additivity of the decomposition]
    keywords: [oaxaca, blinder, decomposition, wage gap, variance decomposition, explained unexplained, components of variance, how much does x matter]
    sections: [data_analysis:sec-decomposition]
    packages: { r: [oaxaca, lme4], python: [statsmodels] }

  # --- Robustness and inference -------------------------------------------
  - id: sensitivity
    name: Sensitivity analysis for unobserved confounding
    family: Robustness
    use_when: An observational estimate is reported, and the strength an unobserved confounder would need to overturn it must be assessed.
    assumptions: [A benchmark covariate or plausible bounds on confounding strength]
    keywords: [sensitivity analysis, unobserved confounding, omitted variable bias, e-value, rosenbaum bounds, sensemakr, robustness value, oster, coefficient stability, konfound]
    sections: [data_analysis:sec-matching-methods#sec-rosenbaum-bounds, data_analysis:sec-matching-methods#sec-coefficient-stability-bounds, data_analysis:sec-endogeneity#sec-omitted-variable-bias, causalverse:articles/j_sensitivity]
    packages: { r: [sensemakr, EValue, rbounds, konfound], python: [PySensemakr] }

  - id: clustered_se
    name: Clustered and robust standard errors
    family: Robustness
    use_when: Errors are correlated within groups (firms, schools, states, markets) or treatment is assigned at the group level.
    assumptions: [Clusters independent of each other, Enough clusters, or a wild cluster bootstrap when they are few]
    keywords: [clustered standard errors, cluster-robust, robust standard errors, heteroskedasticity, wild cluster bootstrap, few clusters, sandwich]
    sections: [data_analysis:sec-clustered-inference, data_analysis:sec-clustered-inference#sec-clu-crve, data_analysis:sec-clustered-inference#sec-clu-sim-few]
    packages: { r: [sandwich, fixest, fwildclusterboot], python: [pyfixest, wildboottest, statsmodels] }

  - id: dag_controls
    name: Causal graphs (DAGs) and choosing controls
    family: Research design
    use_when: The choice of control variables must be justified, including which would introduce bias (colliders, mediators, bad controls).
    assumptions: [A defensible causal graph of the data-generating process]
    keywords: [dag, directed acyclic graph, backdoor, collider, bad controls, confounder, which controls, adjustment set, d-separation]
    sections: [data_analysis:sec-directed-acyclic-graphs, data_analysis:sec-controls]
    packages: { r: [dagitty, ggdag], python: [dowhy, networkx] }

  # --- Regression and models -----------------------------------------------
  - id: panel
    name: Panel data (fixed and random effects)
    family: Regression
    use_when: The same units are observed repeatedly, and time-invariant unobserved differences must be controlled for.
    assumptions: [Strict exogeneity conditional on unit effects, Random effects need unit effects uncorrelated with regressors (Hausman test)]
    keywords: [panel data, fixed effects, random effects, within estimator, hausman, mundlak, longitudinal, unit fixed effects]
    sections: [data_analysis:data#sec-panel-data, data_analysis:data#sec-fixed-effects-estimator, data_analysis:data#sec-mundlak-hausman, causalverse:articles/m_panel]
    packages: { r: [fixest, plm], python: [linearmodels, pyfixest] }

  - id: glm
    name: Generalized linear models and limited dependent variables
    family: Regression
    use_when: The outcome is binary, a count, a proportion, or a choice among categories.
    assumptions: [Correct link and variance function, Independent observations]
    keywords: [glm, logistic regression, logit, probit, poisson, negative binomial, count data, binary outcome, multinomial, ordered logit, tobit]
    sections: [data_analysis:generalized-linear-models, data_analysis:sec-discrete-choice]
    packages: { r: [MASS, nnet, fixest], python: [statsmodels] }

  - id: mixed_models
    name: Mixed (multilevel, hierarchical) models
    family: Regression
    use_when: Observations are nested (students in schools, repeated measures within subjects), and group-level variation is of interest.
    assumptions: [Random effects uncorrelated with regressors, Correct random-effects structure]
    keywords: [mixed model, multilevel, hierarchical, random intercept, random slope, lme4, nested data, repeated measures]
    sections: [data_analysis:sec-linear-mixed-models, data_analysis:sec-nonlinear-and-generalized-linear-mixed-models]
    packages: { r: [lme4, glmmTMB, nlme], python: [statsmodels] }

  - id: quantile
    name: Quantile and distributional regression
    family: Regression
    use_when: Effects on the tails or the entire distribution are of interest, not only the mean.
    assumptions: [Correct quantile specification; rank invariance for individual-level readings]
    keywords: [quantile regression, distributional regression, median regression, tails, conditional quantiles]
    sections: [data_analysis:sec-quantile-distributional]
    packages: { r: [quantreg], python: [statsmodels] }

  - id: time_series
    name: Time series analysis and forecasting
    family: Regression
    use_when: A series is modeled or forecast over time in the presence of trend, seasonality, and autocorrelation.
    assumptions: [Stationarity or appropriate differencing, Stable dynamics over the sample]
    keywords: [time series, forecasting, arima, var, stationarity, unit root, seasonality, autocorrelation, cointegration]
    sections: [data_analysis:sec-time-series]
    packages: { r: [forecast, fable, tseries], python: [statsmodels] }

  - id: missing_data
    name: Missing data and multiple imputation
    family: Data
    use_when: Some values are missing and dropping incomplete rows would bias results or waste data.
    assumptions: [Missing at random given observed data for standard multiple imputation]
    keywords: [missing data, imputation, multiple imputation, mice, missing at random, mar, mcar, mnar]
    sections: [data_analysis:imputation-missing-data]
    packages: { r: [mice, missForest, Amelia], python: [scikit-learn, statsmodels] }

  - id: survey_measurement
    name: Survey measurement, scales, and reliability
    family: Data
    use_when: Multi-item scales are constructed or validated, or survey data are analyzed with weights and design effects.
    assumptions: [The items measure the intended construct, A known sampling design for weighting]
    keywords: [survey, scale, reliability, cronbach alpha, validity, confirmatory factor analysis, cfa, measurement, likert, survey weights, sampling design]
    sections: [data_analysis:sec-survey-reliability, data_analysis:sampling, marketing_research:30-measurement-scales]
    packages: { r: [lavaan, psych, survey], python: [semopy, factor_analyzer, samplics] }

  # --- Structural and marketing ---------------------------------------------
  - id: demand
    name: Discrete choice and demand estimation (logit, nested logit, BLP)
    family: Structural
    use_when: Consumer demand, substitution patterns, or elasticities are estimated, or prices and mergers are simulated, from market or choice data.
    assumptions: [A specified utility model, Instruments for price in market-level data]
    keywords: [demand estimation, blp, random coefficients, nested logit, mixed logit, discrete choice, elasticities, market shares, merger simulation]
    sections: [data_analysis:sec-discrete-choice, data_analysis:sec-structural-io#the-blp-random-coefficients-model, data_analysis:sec-demand-systems, data_analysis:sec-markups-mergers]
    packages: { r: [mlogit, logitr], python: [pyblp, xlogit] }

  - id: production
    name: Production functions, productivity, and markups
    family: Structural
    use_when: Firm productivity or markups are estimated from production data.
    assumptions: [A timing assumption for inputs (Olley-Pakes, Levinsohn-Petrin, ACF), Scalar unobservable productivity]
    keywords: [production function, productivity, tfp, olley pakes, levinsohn petrin, ackerberg caves frazer, markups, de loecker]
    sections: [data_analysis:sec-production-productivity, data_analysis:sec-production-productivity#markups-and-market-power-the-production-approach]
    packages: { r: [prodest], python: [] }

  - id: clv
    name: Customer lifetime value and customer-base analysis
    family: Marketing
